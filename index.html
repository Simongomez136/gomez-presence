<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --cyan: #00C2D1;
  --cyan-deep: #009AA8;
  --cyan-pale: #E3FAFC;
  --ink: #16232B;
  --ink-soft: #6C7A80;
  --line: #DEE5E7;
  --paper: #F6F9FA;
  --white: #FFFFFF;
  --bureau: #35506B;
  --bureau-bg: #E7ECF1;
  --clientele: #007E8C;
  --clientele-bg: #DAF3F5;
  --conge: #5C7A54;
  --conge-bg: #E6EEE3;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:600px;
  margin:0 auto;
  padding:0 0 60px;
  min-height:100vh;
}
button{font-family:inherit;}

/* ---------- header ---------- */
.brand-header{
  background:var(--white);
  border-bottom:1px solid var(--line);
  padding:18px 20px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand-header img{
  height:34px;
  width:auto;
  display:block;
}
.brand-tag{
  font-size:12.5px;
  color:var(--ink-soft);
  text-align:right;
  line-height:1.3;
}

.content{padding:22px 20px 0;}

/* ---------- name screen ---------- */
.hero{margin-bottom:22px;}
h1.title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:26px;
  margin:0 0 4px;
  letter-spacing:-0.01em;
}
.subtitle{
  color:var(--ink-soft);
  font-size:14.5px;
  margin:0;
}
.name-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:22px;
}
.name-btn{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px 14px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:15.5px;
  color:var(--ink);
  text-align:left;
  cursor:pointer;
  transition:border-color .15s ease, transform .1s ease;
}
.name-btn:active{transform:scale(0.98);}
.name-btn:hover{border-color:var(--cyan);}

.add-row{
  display:flex;
  gap:8px;
  border-top:1px solid var(--line);
  padding-top:18px;
}
.add-row input{
  flex:1;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:15px;
  background:var(--white);
  color:var(--ink);
}
.add-row input:focus{outline:2px solid var(--cyan); outline-offset:1px;}
.add-row button{
  background:var(--ink);
  color:var(--white);
  border:none;
  border-radius:8px;
  padding:0 20px;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
}
.add-row button:hover{background:var(--cyan-deep);}

.manager-row{
  margin-top:26px;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
}
.overview-entry{
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:13.5px;
  cursor:pointer;
  text-decoration:underline;
  padding:4px;
}
.overview-entry:hover{color:var(--ink);}

.empty-note{
  color:var(--ink-soft);
  font-size:14.5px;
  margin-bottom:20px;
}

/* ---------- overview screen ---------- */
.ov-legend{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
  margin-bottom:20px;
  font-size:12px;
  color:var(--ink-soft);
}
.ov-legend span{display:inline-flex; align-items:center; gap:5px;}
.lg-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.lg-bureau{background:var(--bureau);}
.lg-clientele{background:var(--clientele);}
.lg-conge{background:var(--conge);}
.lg-empty{background:var(--line);}

.ov-card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 18px 16px;
  margin-bottom:14px;
}
.ov-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:14px;
}
.ov-name{
  font-family:'Fraunces',serif;
  font-size:18px;
  font-weight:500;
}
.ov-progress{
  font-size:12.5px;
  color:var(--ink-soft);
}
.ov-days{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.ov-day{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.ov-dlabel{font-size:11px; color:var(--ink-soft); font-weight:600;}
.half-pill{
  width:22px;
  border:1px solid var(--line);
  border-radius:6px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.half{height:6px; background:var(--white);}
.half-bureau{background:var(--bureau);}
.half-clientele{background:var(--clientele);}
.half-conge{background:var(--conge);}

.ov-detail-toggle{
  display:block;
  margin:14px auto 0;
  background:none;
  border:none;
  color:var(--cyan-deep);
  font-size:12.5px;
  text-decoration:underline;
  cursor:pointer;
  padding:4px;
}
.ov-detail-toggle:hover{color:var(--ink);}
.ov-detail-list{
  margin-top:10px;
  padding-top:12px;
  border-top:1px dashed var(--line);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.ov-detail-row{
  display:flex;
  flex-direction:column;
  gap:3px;
}
.oday{color:var(--ink); font-weight:600; font-size:13px;}
.oval{color:var(--ink-soft); font-size:12.5px;}
.onote{color:var(--ink-soft); font-size:12px; font-style:italic;}

/* ---------- week screen ---------- */
.backlink{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:13.5px;
  cursor:pointer;
  padding:0;
  margin-bottom:14px;
}
.backlink:hover{color:var(--ink);}

.emp-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:16px;
}
.emp-name{
  font-family:'Fraunces',serif;
  font-size:22px;
  font-weight:500;
}

.week-nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:18px;
}
.nav-btn{
  width:32px;height:32px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  font-size:16px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.nav-btn:hover{border-color:var(--cyan);}
.week-label{
  font-size:13.5px;
  color:var(--ink-soft);
  min-width:170px;
  text-align:center;
}

/* day tabs */
.day-tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-bottom:22px;
}
.day-tab{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 2px 8px;
  text-align:center;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}
.day-tab .dlabel{font-size:12px; color:var(--ink-soft); font-weight:600;}
.day-tab .dnum{font-size:14px; color:var(--ink); font-weight:600;}
.day-tab .ddot{width:7px;height:7px;border-radius:50%;background:var(--line);}
.day-tab.selected{border-color:var(--ink); background:var(--ink);}
.day-tab.selected .dlabel, .day-tab.selected .dnum{color:var(--white);}
.day-tab .ddot.filled-bureau{background:var(--bureau);}
.day-tab .ddot.filled-clientele{background:var(--clientele);}
.day-tab .ddot.filled-conge{background:var(--conge);}
.day-tab .ddot.filled-partial{background:var(--ink-soft);}

/* day panel */
.day-panel{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px 20px 20px;
}
.day-panel-title{
  font-family:'Fraunces',serif;
  font-size:19px;
  margin:0 0 18px;
}

.slot-block{margin-bottom:20px;}
.slot-block + .slot-block{
  border-top:1px dashed var(--line);
  padding-top:18px;
}
.slot-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.slot-label{
  font-family:'Fraunces',serif;
  font-size:15px;
  font-weight:500;
  color:var(--ink);
}
.copy-link{
  background:none;
  border:none;
  color:var(--cyan-deep);
  font-size:12.5px;
  text-decoration:underline;
  cursor:pointer;
  padding:0;
}
.copy-link:hover{color:var(--ink);}

.status-grid{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:6px;
}
.status-btn{
  display:flex;
  align-items:center;
  gap:12px;
  border:1.5px solid var(--line);
  background:var(--white);
  border-radius:11px;
  padding:15px 16px;
  font-size:16px;
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
  text-align:left;
  transition:all .12s ease;
}
.status-btn:active{transform:scale(0.985);}
.status-btn .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(0,0,0,0.1);}
.status-btn.sel-bureau{border-color:var(--bureau); background:var(--bureau-bg); color:var(--bureau);}
.status-btn.sel-clientele{border-color:var(--clientele); background:var(--clientele-bg); color:var(--clientele);}
.status-btn.sel-conge{border-color:var(--conge); background:var(--conge-bg); color:var(--conge);}
.status-btn .dot-bureau{background:var(--bureau);}
.status-btn .dot-clientele{background:var(--clientele);}
.status-btn .dot-conge{background:var(--conge);}

.region-wrap{
  margin-top:4px;
  padding-top:14px;
  border-top:1px dashed var(--line);
}
.region-hint{font-size:13px; color:var(--ink-soft); margin:0 0 10px;}
.region-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.region-chip{
  border:1px solid var(--line);
  background:var(--white);
  border-radius:999px;
  padding:8px 14px;
  font-size:13.5px;
  font-weight:500;
  color:var(--ink-soft);
  cursor:pointer;
}
.region-chip:hover{border-color:var(--clientele);}
.region-chip.active{background:var(--clientele); border-color:var(--clientele); color:var(--white); font-weight:600;}

.apply-week{
  margin-top:16px;
  width:100%;
  background:none;
  border:1px dashed var(--line);
  border-radius:10px;
  padding:11px;
  font-size:13.5px;
  color:var(--ink-soft);
  cursor:pointer;
  font-weight:500;
}
.apply-week:hover{border-color:var(--cyan); color:var(--cyan-deep);}

.note-block{
  margin-top:20px;
  padding-top:18px;
  border-top:1px dashed var(--line);
}
.note-input{
  display:block;
  width:100%;
  margin-top:10px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  font-family:'Inter',sans-serif;
  font-size:14px;
  color:var(--ink);
  background:var(--white);
  resize:vertical;
  min-height:64px;
}
.note-input:focus{outline:2px solid var(--cyan); outline-offset:1px;}

.detail-toggle{
  display:block;
  margin:16px auto 0;
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:13px;
  text-decoration:underline;
  cursor:pointer;
  padding:6px;
}
.detail-toggle:hover{color:var(--ink);}

.moment-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  flex-wrap:wrap;
}
.moment-row + .moment-row{border-top:1px dashed var(--line);}
.moment-label{
  font-size:13.5px;
  color:var(--ink-soft);
  width:120px;
  flex-shrink:0;
}
.pill-group{display:flex; gap:5px; flex-wrap:wrap;}
.pill{
  border:1px solid var(--line);
  background:var(--white);
  border-radius:999px;
  padding:6px 12px;
  font-size:12.5px;
  color:var(--ink-soft);
  cursor:pointer;
}
.pill.active-bureau{background:var(--bureau-bg); border-color:var(--bureau); color:var(--bureau); font-weight:600;}
.pill.active-clientele{background:var(--clientele-bg); border-color:var(--clientele); color:var(--clientele); font-weight:600;}
.pill.active-conge{background:var(--conge-bg); border-color:var(--conge); color:var(--conge); font-weight:600;}
.pill.active-region{background:var(--ink); border-color:var(--ink); color:var(--white); font-weight:600;}
.moment-region-row{padding:0 0 10px 130px;}

.sync-note{
  text-align:center;
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:16px;
  min-height:16px;
}
.sync-note.saved{color:var(--conge);}

.loading{
  color:var(--ink-soft);
  font-size:15px;
  padding:50px 0;
  text-align:center;
}
</style>

function slotText(slotObj){
  if(!slotObj || !slotObj.status) return 'Non renseigné';
  let txt = STATUS_LABELS[slotObj.status];
  if(slotObj.status === 'clientele' && slotObj.region) txt += ' — ' + slotObj.region;
  return txt;
}

  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function startOfWeek(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function formatDayFull(d){
  return d.toLocaleDateString('fr-BE',{weekday:'long', day:'numeric', month:'long'});
}
function formatWeekLabel(monday){
  const friday = addDays(monday,4);
  const sameMonth = monday.getMonth() === friday.getMonth();
  const startStr = monday.toLocaleDateString('fr-BE', sameMonth ? {day:'numeric'} : {day:'numeric', month:'long'});
  const endStr = friday.toLocaleDateString('fr-BE', {day:'numeric', month:'long'});
  return startStr + ' – ' + endStr;
}
function safeKey(str){ return str.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function emptyDay(){
  return {
    moments:[
      {status:null, region:null},
      {status:null, region:null},
      {status:null, region:null},
      {status:null, region:null}
    ],
    note:''
  };
}
function emptyWeek(){ return [emptyDay(),emptyDay(),emptyDay(),emptyDay(),emptyDay()]; }

function normalizeDay(d){
  if(d && Array.isArray(d.moments) && d.moments.length === 4){
    return {
      moments: d.moments.map(m => ({
        status: (m && m.status) ? m.status : null,
        region: (m && m.region) ? m.region : null
      })),
      note: (d && typeof d.note === 'string') ? d.note : ''
    };
  }
  return emptyDay();
}
function normalizeWeek(weekArr){
  if(!Array.isArray(weekArr) || weekArr.length !== 5) return emptyWeek();
  return weekArr.map(normalizeDay);
}

function dayStatusSummary(d){
  const statuses = d.moments.map(m => m.status);
  if(statuses.some(s => !s)) return null;
  if(statuses.every(s => s === statuses[0])) return statuses[0];
  return 'partial';
}

const DEFAULT_EMPLOYEES = ['Anthony','Thomas','Xavier'];

async function loadEmployees(){
  try{
    const res = await storageGet('employees:list');
    state.employees = res ? JSON.parse(res.value) : [];
  }catch(e){ state.employees = []; }
  if(state.employees.length === 0){
    state.employees = [...DEFAULT_EMPLOYEES];
    await saveEmployees();
  }
}
async function saveEmployees(){
  try{ await storageSet('employees:list', JSON.stringify(state.employees)); }
  catch(e){ console.error('Erreur sauvegarde liste', e); }
}
async function loadWeek(){
  state.loading = true;
  render();
  const key = 'week:' + safeKey(state.currentEmployee) + ':' + isoDate(state.monday);
  try{
    const res = await storageGet(key);
    state.weekData = res ? normalizeWeek(JSON.parse(res.value)) : emptyWeek();
  }catch(e){ state.weekData = emptyWeek(); }
  state.loading = false;
  state.selectedDay = 0;
  render();
}
let saveTimer = null;
function scheduleSave(){
  state.syncing = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 450);
  render();
}
async function doSave(){
  const key = 'week:' + safeKey(state.currentEmployee) + ':' + isoDate(state.monday);
  try{
    await storageSet(key, JSON.stringify(state.weekData));
    state.savedFlash = true;
  }catch(e){ console.error('Erreur sauvegarde semaine', e); }
  state.syncing = false;
  render();
  setTimeout(()=>{ state.savedFlash = false; render(); }, 1600);
}

function selectEmployee(name){
  state.currentEmployee = name;
  state.screen = 'week';
  state.monday = startOfWeek(new Date());
  loadWeek();
}
function goBackToNames(){
  state.screen = 'name';
  state.currentEmployee = null;
  state.weekData = null;
  render();
}
function changeWeek(delta){ state.monday = addDays(state.monday, delta*7); loadWeek(); }
function selectDay(idx){ state.selectedDay = idx; render(); }

function goToOverview(){
  state.screen = 'overview';
  state.overviewMonday = startOfWeek(new Date());
  state.expandedEmployee = null;
  loadOverview();
}
function goBackFromOverview(){
  state.screen = 'name';
  state.overviewData = null;
  render();
}
function changeOverviewWeek(delta){
  state.overviewMonday = addDays(state.overviewMonday, delta*7);
  loadOverview();
}
async function loadOverview(){
  state.overviewLoading = true;
  render();
  const results = {};
  await Promise.all(state.employees.map(async (name) => {
    const key = 'week:' + safeKey(name) + ':' + isoDate(state.overviewMonday);
    try{
      const res = await storageGet(key);
      results[name] = res ? normalizeWeek(JSON.parse(res.value)) : null;
    }catch(e){
      results[name] = null;
    }
  }));
  state.overviewData = results;
  state.overviewLoading = false;
  render();
}
function toggleEmployeeDetail(name){
  state.expandedEmployee = (state.expandedEmployee === name) ? null : name;
  render();
}
function completedCount(weekData){
  if(!weekData) return 0;
  return weekData.filter(d => d.moments.every(m => m.status)).length;
}

function setMomentStatus(idx, statusKey){
  const d = state.weekData[state.selectedDay];
  d.moments[idx].status = statusKey;
  if(statusKey !== 'clientele') d.moments[idx].region = null;
  scheduleSave();
}
function setMomentRegion(idx, region){
  const d = state.weekData[state.selectedDay];
  d.moments[idx].region = region;
  scheduleSave();
}
function copyMoment(fromIdx, toIdx){
  const d = state.weekData[state.selectedDay];
  d.moments[toIdx] = {status:d.moments[fromIdx].status, region:d.moments[fromIdx].region};
  scheduleSave();
}
function applyToWeek(){
  const src = state.weekData[state.selectedDay];
  if(src.moments.some(m => !m.status)) return;
  for(let i=0;i<5;i++){
    state.weekData[i] = {
      moments: src.moments.map(m => ({status:m.status, region:m.region})),
      note: src.note
    };
  }
  scheduleSave();
}

let noteSaveTimer = null;
function onNoteInput(value){
  const d = state.weekData[state.selectedDay];
  d.note = value;
  state.syncing = true;
  updateSyncIndicator();
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(async () => {
    const key = 'week:' + safeKey(state.currentEmployee) + ':' + isoDate(state.monday);
    try{
      await storageSet(key, JSON.stringify(state.weekData));
      state.savedFlash = true;
    }catch(e){ console.error('Erreur sauvegarde note', e); }
    state.syncing = false;
    updateSyncIndicator();
    setTimeout(()=>{ state.savedFlash = false; updateSyncIndicator(); }, 1600);
  }, 600);
}
function updateSyncIndicator(){
  const el = document.querySelector('.sync-note');
  if(!el) return;
  el.textContent = state.syncing ? 'Enregistrement…' : (state.savedFlash ? 'Enregistré ✓' : '');
  el.classList.toggle('saved', !!state.savedFlash);
}

function renderNameScreen(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="brand-header">
      <img src="${LOGO_SRC}" alt="Gomez &amp; Co">
      <div class="brand-tag">Présence<br>commerciaux</div>
    </div>
    <div class="content">
      <div class="hero">
        <h1 class="title">Qui es-tu ?</h1>
        <p class="subtitle">Sélectionne ton nom pour remplir ton planning.</p>
      </div>
      ${state.employees.length ? `
        <div class="name-grid">
          ${state.employees.map(name => `<button class="name-btn" onclick="selectEmployee('${name.replace(/'/g,"\\'")}')">${name}</button>`).join('')}
        </div>
      ` : `<p class="empty-note">Aucun commercial enregistré. Ajoute le premier nom ci-dessous.</p>`}
      <div class="add-row">
        <input type="text" id="new-name-input" placeholder="Ajouter un commercial" />
        <button onclick="addEmployee()">Ajouter</button>
      </div>
      <div class="manager-row">
        <button class="overview-entry" onclick="goToOverview()">Vue d'ensemble de l'équipe →</button>
      </div>
    </div>
  `;
  document.getElementById('new-name-input').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') addEmployee(); });
}

async function addEmployee(){
  const input = document.getElementById('new-name-input');
  const name = input.value.trim();
  if(!name) return;
  if(state.employees.some(n => n.toLowerCase() === name.toLowerCase())){ input.value=''; return; }
  state.employees.push(name);
  render();
  await saveEmployees();
}

function momentBlockHTML(idx, dayObj){
  const data = dayObj.moments[idx];
  const prev = idx > 0 ? dayObj.moments[idx-1] : null;
  const showCopy = idx > 0 && prev.status && !data.status;
  return `
    <div class="slot-block">
      <div class="slot-head">
        <span class="slot-label">${MOMENT_LABELS[idx]}</span>
        ${showCopy ? `<button class="copy-link" onclick="copyMoment(${idx-1},${idx})">Identique à "${MOMENT_LABELS[idx-1]}"</button>` : ''}
      </div>
      <div class="status-grid">
        ${STATUSES.map(s => `<button class="status-btn ${data.status===s.key ? 'sel-'+s.key : ''}" onclick="setMomentStatus(${idx},'${s.key}')">
          <span class="dot dot-${s.key}"></span>${s.label}
        </button>`).join('')}
      </div>
      ${data.status === 'clientele' ? regionGridHTML(data.region, idx) : ''}
    </div>
  `;
}
function regionGridHTML(current, idx){
  return `<div class="region-wrap">
    <p class="region-hint">Dans quelle région ?</p>
    <div class="region-grid">
      ${REGIONS.map(r => `<button class="region-chip ${current===r?'active':''}" onclick="setMomentRegion(${idx},'${r.replace(/'/g,"\\'")}')">${r}</button>`).join('')}
    </div>
  </div>`;
}

function dayPanelHTML(){
  const d = state.weekData[state.selectedDay];
  const date = addDays(state.monday, state.selectedDay);
  const allFilled = d.moments.every(m => m.status);
  return `
    <div class="day-panel">
      <p class="day-panel-title">${formatDayFull(date)}</p>
      ${d.moments.map((_, idx) => momentBlockHTML(idx, d)).join('')}
      <div class="note-block">
        <span class="slot-label">Note (optionnel)</span>
        <textarea class="note-input" oninput="onNoteInput(this.value)" placeholder="Ex : RDV client à 14h, parti plus tôt…">${escapeHtml(d.note)}</textarea>
      </div>
      ${allFilled ? `<button class="apply-week" onclick="applyToWeek()">Appliquer cette journée à toute la semaine</button>` : ''}
    </div>
  `;
}

function renderWeekScreen(){
  const app = document.getElementById('app');
  if(state.loading || !state.weekData){
    app.innerHTML = `
      <div class="brand-header">
        <img src="${LOGO_SRC}" alt="Gomez &amp; Co">
        <div class="brand-tag">Présence<br>commerciaux</div>
      </div>
      <div class="content">
        <button class="backlink" onclick="goBackToNames()">← Changer de commercial</button>
        <div class="loading">Chargement du planning…</div>
      </div>
    `;
    return;
  }
  app.innerHTML = `
    <div class="brand-header">
      <img src="${LOGO_SRC}" alt="Gomez &amp; Co">
      <div class="brand-tag">Présence<br>commerciaux</div>
    </div>
    <div class="content">
      <button class="backlink" onclick="goBackToNames()">← Changer de commercial</button>
      <div class="emp-row"><span class="emp-name">${state.currentEmployee}</span></div>

      <div class="week-nav">
        <button class="nav-btn" onclick="changeWeek(-1)" aria-label="Semaine précédente">‹</button>
        <span class="week-label">${formatWeekLabel(state.monday)}</span>
        <button class="nav-btn" onclick="changeWeek(1)" aria-label="Semaine suivante">›</button>
      </div>

      <div class="day-tabs">
        ${DAYS_SHORT.map((label, idx) => {
          const date = addDays(state.monday, idx);
          const summary = dayStatusSummary(state.weekData[idx]);
          const dotClass = summary === 'partial' ? 'filled-partial' : (summary ? 'filled-'+summary : '');
          return `
            <div class="day-tab ${idx===state.selectedDay?'selected':''}" onclick="selectDay(${idx})">
              <span class="dlabel">${label}</span>
              <span class="dnum">${date.getDate()}</span>
              <span class="ddot ${dotClass}"></span>
            </div>
          `;
        }).join('')}
      </div>

      ${dayPanelHTML()}

      <div class="sync-note ${state.savedFlash ? 'saved' : ''}">${state.syncing ? 'Enregistrement…' : (state.savedFlash ? 'Enregistré ✓' : '')}</div>
    </div>
  `;
}

function overviewDayDotsHTML(weekData, dayIdx){
  const d = weekData ? weekData[dayIdx] : null;
  return `
    <div class="ov-day">
      <span class="ov-dlabel">${DAYS_SHORT[dayIdx]}</span>
      <div class="half-pill">
        ${[0,1,2,3].map(i => {
          const m = d ? d.moments[i] : null;
          const cls = m && m.status ? 'half-'+m.status : '';
          return `<div class="half ${cls}"></div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function employeeCardHTML(name){
  const weekData = state.overviewData ? state.overviewData[name] : null;
  const count = completedCount(weekData);
  const expanded = state.expandedEmployee === name;
  return `
    <div class="ov-card">
      <div class="ov-head">
        <span class="ov-name">${name}</span>
        <span class="ov-progress">${count}/5 jours</span>
      </div>
      <div class="ov-days">
        ${DAYS_SHORT.map((_, idx) => overviewDayDotsHTML(weekData, idx)).join('')}
      </div>
      <button class="ov-detail-toggle" onclick="toggleEmployeeDetail('${name.replace(/'/g,"\\'")}')">${expanded ? 'Masquer le détail' : 'Voir le détail'}</button>
      ${expanded ? `
        <div class="ov-detail-list">
          ${DAYS.map((dayLabel, idx) => {
            const d = weekData ? weekData[idx] : null;
            const moments = d ? d.moments : [null,null,null,null];
            const line = moments.map(m => slotText(m)).join(' · ');
            return `
              <div class="ov-detail-row">
                <span class="oday">${dayLabel}</span>
                <span class="oval">${line}</span>
                ${d && d.note ? `<span class="onote">📝 ${escapeHtml(d.note)}</span>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

function renderOverviewScreen(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="brand-header">
      <img src="${LOGO_SRC}" alt="Gomez &amp; Co">
      <div class="brand-tag">Présence<br>commerciaux</div>
    </div>
    <div class="content">
      <button class="backlink" onclick="goBackFromOverview()">← Retour</button>
      <div class="hero" style="margin-bottom:16px;">
        <h1 class="title" style="font-size:22px;">Vue d'ensemble</h1>
        <p class="subtitle">Ce que l'équipe a rempli, semaine par semaine.</p>
      </div>

      <div class="week-nav">
        <button class="nav-btn" onclick="changeOverviewWeek(-1)" aria-label="Semaine précédente">‹</button>
        <span class="week-label">${formatWeekLabel(state.overviewMonday)}</span>
        <button class="nav-btn" onclick="changeOverviewWeek(1)" aria-label="Semaine suivante">›</button>
      </div>

      <div class="ov-legend">
        <span><i class="lg-dot lg-bureau"></i>Bureau</span>
        <span><i class="lg-dot lg-clientele"></i>Clientèle</span>
        <span><i class="lg-dot lg-conge"></i>Congé</span>
        <span><i class="lg-dot lg-empty"></i>Non renseigné</span>
      </div>

      ${state.overviewLoading ? `<div class="loading">Chargement…</div>` : (
        state.employees.length ? state.employees.map(name => employeeCardHTML(name)).join('') : `<p class="empty-note">Aucun commercial enregistré.</p>`
      )}
    </div>
  `;
}

function render(){
  if(state.screen === 'name') renderNameScreen();
  else if(state.screen === 'overview') renderOverviewScreen();
  else renderWeekScreen();
}

async function init(){
  document.getElementById('app').innerHTML = '<div class="loading">Chargement…</div>';
  await loadEmployees();
  render();
}
init();
</script>
</body>
</html>
